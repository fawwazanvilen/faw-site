<!DOCTYPE html>
<html lang="en" class="light">
<head>
    {{ partial "head.html" . }}
</head>
<body class="bg-light text-dark font-body dark:bg-darkMode-light dark:text-darkMode-dark">
    <div class="max-w-4xl mx-auto px-6 py-12">
        <header class="mb-8 border-b border-lightgray dark:border-darkMode-lightgray pb-4">
            {{ partial "header.html" . }}
        </header>
        <main>
            {{ block "main" . }}{{ end }}
        </main>
        <footer class="mt-12 pt-6 border-t border-lightgray dark:border-darkMode-lightgray text-darkgray dark:text-darkMode-darkgray">
            {{ partial "footer.html" . }}
        </footer>
    </div>
</body>
</html>
