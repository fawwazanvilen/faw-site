{{ define "main" }}
  <h1 class="text-2xl font-header font-bold mb-4 text-dark dark:text-darkMode-dark">{{ .Title }}</h1>
  <div class="mb-6">{{ .Content }}</div>
  <ul class="mt-4 space-y-4">
    {{ range .Pages }}
      <li class="border-l-2 border-lightgray dark:border-darkMode-lightgray pl-4 py-1 hover:border-primary transition-colors">
        <a href="{{ .Permalink }}" class="text-dark dark:text-darkMode-dark hover:text-primary dark:hover:text-primary transition-colors">{{ .Title }}</a>
        <span class="text-gray dark:text-darkMode-gray text-sm ml-2">{{ .Date.Format "2006-01-02" }}</span>
      </li>
    {{ end }}
  </ul>
{{ end }}
