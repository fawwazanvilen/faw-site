<!DOCTYPE html>
<html lang="en">
<head>
    {{ partial "head.html" . }}
</head>
<body class="bg-warm-bg text-ink font-sans antialiased">
    <div class="mx-auto max-w-2xl px-6 py-12 md:py-20">
        <header class="mb-16">
            {{ partial "header.html" . }}
        </header>
        <main class="mb-20">
            {{ block "main" . }}{{ end }}
        </main>
        <footer class="border-t border-ink/10 pt-8 text-sm text-ink-faint">
            {{ partial "footer.html" . }}
        </footer>
    </div>
</body>
</html>
